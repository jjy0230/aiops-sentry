apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-sentry-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-sentry-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "endpoints", "services"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-sentry-binding
subjects:
  - kind: ServiceAccount
    name: aiops-sentry-sa
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: aiops-sentry-role
  apiGroup: rbac.authorization.k8s.io
