version: '3.8'

services:
  aiops-sentry:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aiops-sentry
    ports:
      - "8080:8080"
    environment:
      - SENTRY_PORT=8080
      - SENTRY_HOST=0.0.0.0
      - SENTRY_USE_MOCK_ENGINE=true
      - SENTRY_COOLDOWN_SECONDS=180
      - SENTRY_MIN_CONFIDENCE=0.75
      - SENTRY_MIN_MARGIN=0.20
    restart: unless-stopped
